name: Rindo
options:
  bundleIdPrefix: com.osprey74
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-native-distribution.git
    from: "6.0.0"

targets:
  Rindo:
    type: application
    platform: iOS
    sources:
      - path: Rindo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osprey74.rindo
        DEVELOPMENT_TEAM: 9L6A9KDH5P
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: MapLibre
    info:
      path: Rindo/Resources/Info.plist
      properties:
        CFBundleDisplayName: Rindo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: "public.app-category.navigation"
        NSLocationWhenInUseUsageDescription: "走行中のナビゲーションと現在地表示に使用します"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  RindoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RindoTests
    dependencies:
      - target: Rindo
