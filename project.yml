name: Rindo
options:
  bundleIdPrefix: com.osprey74
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-native-distribution.git
    from: "6.0.0"

schemes:
  Rindo:
    build:
      targets:
        Rindo: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Rindo:
    type: application
    platform: iOS
    sources:
      - path: Rindo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osprey74.rindo
        DEVELOPMENT_TEAM: 9L6A9KDH5P
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Rindo/Resources/Rindo.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - package: MapLibre
    info:
      path: Rindo/Resources/Info.plist
      properties:
        CFBundleDisplayName: Rindo
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: "public.app-category.navigation"
        NSLocationWhenInUseUsageDescription: "走行中のナビゲーションと現在地表示に使用します"
        NSLocationAlwaysAndWhenInUseUsageDescription: "バックグラウンドでも走行ログを記録します"
        NSHealthShareUsageDescription: "体重を取得して消費カロリーを計算します"
        NSHealthUpdateUsageDescription: "ワークアウトとして走行ログを記録します"
        UIBackgroundModes:
          - location
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true

  RindoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RindoTests
    dependencies:
      - target: Rindo
